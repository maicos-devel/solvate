name: Tests

on:
  push:
    branches: [main]
  pull_request:
    # Check all PR
  schedule:
    # check once a week on mondays
    - cron: '0 10 * * 1'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        check-latest: true

    - run: python -m pip install tox coverage[toml]

    - name: run Python tests
      run: |
        tox -e tests
        # coverage xml

